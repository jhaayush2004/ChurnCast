<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Customer Churn Prediction</h1>
        <p>Enter the customer details below to predict the likelihood of churn.</p>

        <form method="post" action="/">
            <!-- Row 1 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="Tenure">Tenure (in months):</label>
                    <input type="number" step="any" id="Tenure" name="Tenure" placeholder="e.g., 12.5" required>
                </div>
                <div class="form-group">
                    <label for="CityTier">City Tier:</label>
                    <input type="number" id="CityTier" name="CityTier" placeholder="e.g., 1" required>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="WarehouseToHome">Warehouse to Home (in km):</label>
                    <input type="number" step="any" id="WarehouseToHome" name="WarehouseToHome" placeholder="e.g., 25.5" required>
                </div>
                <div class="form-group">
                    <label for="HourSpendOnApp">Hours Spent on App:</label>
                    <input type="number" step="any" id="HourSpendOnApp" name="HourSpendOnApp" placeholder="e.g., 3.5" required>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="NumberOfDeviceRegistered">Devices Registered:</label>
                    <input type="number" id="NumberOfDeviceRegistered" name="NumberOfDeviceRegistered" placeholder="e.g., 3" required>
                </div>
                <div class="form-group">
                    <label for="SatisfactionScore">Satisfaction Score:</label>
                    <select id="SatisfactionScore" name="SatisfactionScore" required>
                        <option value="1">1 (Very Dissatisfied)</option>
                        <option value="2">2</option>
                        <option value="3">3 (Neutral)</option>
                        <option value="4">4</option>
                        <option value="5">5 (Very Satisfied)</option>
                    </select>
                </div>
            </div>
            
            <!-- Row 4 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="NumberOfAddress">Number of Addresses:</label>
                    <input type="number" id="NumberOfAddress" name="NumberOfAddress" placeholder="e.g., 2" required>
                </div>
                <div class="form-group">
                    <label for="Complain">Complaint Raised (Last Month):</label>
                    <select id="Complain" name="Complain" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
            </div>

            <!-- Row 5 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="OrderAmountHikeFromlastYear">Order Amount Hike (% from last year):</label>
                    <input type="number" step="any" id="OrderAmountHikeFromlastYear" name="OrderAmountHikeFromlastYear" placeholder="e.g., 15.5" required>
                </div>
                <div class="form-group">
                    <label for="CouponUsed">Coupons Used (Last Month):</label>
                    <input type="number" step="any" id="CouponUsed" name="CouponUsed" placeholder="e.g., 1.0" required>
                </div>
            </div>
            
            <!-- Row 6 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="OrderCount">Total Orders (Last Month):</label>
                    <input type="number" step="any" id="OrderCount" name="OrderCount" placeholder="e.g., 2.0" required>
                </div>
                <div class="form-group">
                    <label for="DaySinceLastOrder">Days Since Last Order:</label>
                    <input type="number" step="any" id="DaySinceLastOrder" name="DaySinceLastOrder" placeholder="e.g., 10.0" required>
                </div>
            </div>

            <!-- Row 7 -->
            <div class="form-row">
                 <div class="form-group">
                    <label for="CashbackAmount">Cashback Amount (Last Month):</label>
                    <input type="number" step="any" id="CashbackAmount" name="CashbackAmount" placeholder="e.g., 150.75" required>
                </div>
                <div class="form-group">
                    <label for="Gender">Gender:</label>
                    <select id="Gender" name="Gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <!-- Row 8 -->
            <div class="form-row">
                <div class="form-group">
                    <label for="PreferedOrderCat">Preferred Order Category:</label>
                    <select id="PreferedOrderCat" name="PreferedOrderCat" required>
                        <option value="Laptop & Accessory">Laptop & Accessory</option>
                        <option value="Mobile Phone">Mobile Phone</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                 <div class="form-group">
                    <label for="MaritalStatus">Marital Status:</label>
                    <select id="MaritalStatus" name="MaritalStatus" required>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Divorced">Divorced</option>
                    </select>
                </div>
            </div>

            <!-- Row 9 -->
            <div class="form-row">
                 <div class="form-group">
                    <label for="PreferredLoginDevice">Preferred Login Device:</label>
                    <select id="PreferredLoginDevice" name="PreferredLoginDevice" required>
                        <option value="Mobile Phone">Mobile Phone</option>
                        <option value="Computer">Computer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="PreferredPaymentMode">Preferred Payment Mode:</label>
                    <select id="PreferredPaymentMode" name="PreferredPaymentMode" required>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="E wallet">E-wallet</option>
                        <option value="UPI">UPI</option>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                    </select>
                </div>
            </div>

            <button type="submit">Predict Churn</button>
        </form>

        <form method="get" action="/train">
            <button type="submit" class="train-button">Train New Model</button>
        </form>

        {% if context and context != "Rendering" %}
            <div class="result">
                <h2>Prediction Result: <span class="prediction-text">{{ context }}</span></h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
